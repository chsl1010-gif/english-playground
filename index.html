<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>영어 놀이터</title>
<meta name="description" content="영어를 처음 배우는 아이들을 위한 그림·소리 단어 게임. 미션을 성공하면 별을 받고, 별 5개를 모으면 다음 레벨로 올라가요.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Fredoka:wght@500;600;700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: a sticker-book page on grid paper — player chip on top, today's mission up front, level map below */
:root {
  --paper: #eaf4fb;
  --grid: #d3e6f3;
  --card: #ffffff;
  --ink: #1d2f4a;
  --ink-soft: #5a6f8c;
  --sun: #ffc93c;
  --sun-ink: #4a3500;
  --sky: #3d8bfd;
  --good: #2fa866;
  --bad: #e5533d;
  --shadow: 0 4px 0 #b9d3e6;
  --display: "Jua", "Gowun Dodum", system-ui, sans-serif;
  --body: "Gowun Dodum", "Jua", system-ui, sans-serif;
  --en: "Fredoka", "Jua", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #142033; --grid: #1c2c44; --card: #1f3150; --ink: #eef4ff; --ink-soft: #9fb3d1;
    --sun: #ffcf4d; --sun-ink: #3a2900; --sky: #6aa8ff; --good: #45c27f; --bad: #ff7a64;
    --shadow: 0 4px 0 #0b1424; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #142033; --grid: #1c2c44; --card: #1f3150; --ink: #eef4ff; --ink-soft: #9fb3d1;
  --sun: #ffcf4d; --sun-ink: #3a2900; --sky: #6aa8ff; --good: #45c27f; --bad: #ff7a64;
  --shadow: 0 4px 0 #0b1424; color-scheme: dark;
}
* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
img { max-width: 100%; }
html, body { min-height: 100%; }
body { margin: 0; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  min-height: 100%;
}
.wrap {
  max-width: 860px; margin: 0 auto;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(28px, 6vw, 40px); margin: 0; letter-spacing: -0.5px; }
h1 .en { font-family: var(--en); color: var(--sky); font-weight: 700; }
h2 { font-family: var(--display); font-weight: 400; font-size: 24px; margin: 0; text-wrap: balance; }
.head-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.kid-chip {
  font-family: var(--display); font-size: 18px; display: flex; align-items: center; gap: 6px;
  border: 3px solid var(--ink); background: var(--card); color: var(--ink); border-radius: 999px;
  padding: 4px 14px 4px 6px; cursor: pointer; box-shadow: var(--shadow);
}
.kid-chip .av { font-size: 26px; line-height: 1; }
.stars {
  font-family: var(--display); font-size: 18px; background: var(--sun); color: var(--sun-ink);
  border-radius: 999px; padding: 6px 14px; box-shadow: var(--shadow); font-variant-numeric: tabular-nums;
}
.save-note { font-size: 13px; color: var(--ink-soft); text-align: center; }

button:focus-visible, input:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }

.stage { background: var(--card); border: 3px solid var(--ink); border-radius: 22px; padding: 20px; box-shadow: var(--shadow); min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.hint { font-family: var(--display); font-size: 18px; color: var(--ink-soft); margin: 0; text-align: center; text-wrap: balance; }
.btn {
  font-family: var(--display); font-size: 20px; border: 3px solid var(--ink); background: var(--sun); color: var(--sun-ink);
  border-radius: 14px; padding: 10px 24px; cursor: pointer; box-shadow: var(--shadow);
}
.btn.plain { background: var(--card); color: var(--ink); }
.btn:disabled { opacity: .5; cursor: default; }
.btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.link-btn { font-family: var(--display); font-size: 17px; border: none; background: none; color: var(--ink-soft); cursor: pointer; padding: 4px 6px; }

/* home: level + mission */
.level-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.level-badge { font-family: var(--display); font-size: 15px; color: var(--sky); letter-spacing: .5px; }
.slots { display: flex; gap: 6px; }
.slot { width: 38px; height: 38px; display: grid; place-items: center; font-size: 30px; line-height: 1; color: var(--grid); }
.slot.on { color: var(--sun); text-shadow: 0 2px 0 var(--sun-ink); }
.slot.new { animation: pop .6s 2; }
.slots-note { font-size: 14px; color: var(--ink-soft); }
.mission {
  display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center;
  background: var(--paper); border: 3px dashed var(--sky); border-radius: 18px; padding: 16px;
}
.mission .icon { width: 64px; height: 64px; border-radius: 50%; background: var(--sky); color: #fff; display: grid; place-items: center; font-family: var(--en); font-weight: 700; font-size: 22px; }
.mission .icon.boss { background: var(--bad); }
.mission .label { font-family: var(--display); font-size: 14px; color: var(--sky); }
.mission .what { font-family: var(--display); font-size: 21px; margin-top: 2px; text-wrap: balance; }
.mission .btn { grid-column: 1 / -1; justify-self: stretch; font-size: 24px; }

.map { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.tile {
  border: 3px solid var(--grid); background: var(--paper); color: var(--ink); border-radius: 16px; padding: 10px 4px 8px;
  display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; position: relative; min-width: 0;
}
.tile .emo { font-size: 32px; line-height: 1.1; }
.tile .nm { font-family: var(--display); font-size: 15px; }
.tile .lv { font-family: var(--en); font-weight: 600; font-size: 12px; color: var(--ink-soft); }
.tile.now { border-color: var(--sun); background: color-mix(in srgb, var(--sun) 22%, var(--paper)); }
.tile.done::after { content: "★"; position: absolute; top: 4px; right: 8px; color: var(--sun); font-size: 16px; }
.tile:disabled { cursor: default; opacity: .45; filter: grayscale(1); }
.section-title { font-family: var(--display); font-size: 18px; color: var(--ink-soft); margin: 0; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--paper); border-radius: 14px; padding: 10px; text-align: center; }
.stat b { display: block; font-family: var(--en); font-size: 26px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--ink-soft); }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.log li { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: center; font-size: 15px; padding: 6px 10px; border-radius: 10px; background: var(--paper); }
.log .mk { font-size: 18px; text-align: center; }
.log .mk.ok { color: var(--sun); }
.log .mk.no { color: var(--ink-soft); }
.log time { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

/* play bar */
.playbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.playbar .goal { font-family: var(--display); font-size: 16px; background: var(--paper); border-radius: 999px; padding: 6px 14px; }

/* picture */
.pic { display: grid; place-items: center; line-height: 1; }
.pic .emo { font-size: var(--pic, 56px); }
.pic .swatch { width: calc(var(--pic, 56px) * 1.1); height: calc(var(--pic, 56px) * 1.1); border-radius: 50%; border: 3px solid var(--ink); }
.pic .num { font-family: var(--en); font-weight: 700; font-size: calc(var(--pic, 56px) * 0.95); color: var(--sky); }
.pic .dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; max-width: calc(var(--pic,56px) * 1.4); margin-top: 4px; }
.pic .dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--sun); border: 1.5px solid var(--sun-ink); }

/* learn */
.learn { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.lcard {
  --pic: 58px;
  border: 3px solid var(--grid); background: var(--paper); border-radius: 18px; padding: 16px 8px 12px;
  cursor: pointer; color: var(--ink); display: flex; flex-direction: column; align-items: center; gap: 8px;
  transition: transform .15s; position: relative;
}
.lcard:hover { transform: translateY(-3px); }
.lcard.heard { border-color: var(--good); }
.lcard.heard::after { content: "✓"; position: absolute; top: 6px; right: 10px; color: var(--good); font-weight: 700; }
.lcard.speaking { border-color: var(--sun); animation: wiggle .5s; }
.lcard .word { font-family: var(--en); font-weight: 700; font-size: 24px; }
.lcard .say { font-family: var(--display); font-size: 16px; color: var(--ink-soft); }
.lcard .ko { font-size: 13px; color: var(--ink-soft); }

/* quiz */
.quiz-top { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.speak-big {
  width: 96px; height: 96px; border-radius: 50%; border: 4px solid var(--ink); background: var(--sun); color: var(--sun-ink);
  cursor: pointer; display: grid; place-items: center; box-shadow: var(--shadow);
}
.speak-big svg { width: 48px; height: 48px; }
.speak-big.ping { animation: pop .4s; }
.qword { font-family: var(--en); font-weight: 700; font-size: 22px; min-height: 28px; color: var(--ink-soft); }
.options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; max-width: 520px; margin: 0 auto; }
.options.six { grid-template-columns: repeat(3, 1fr); max-width: 600px; }
.opt {
  --pic: 60px; aspect-ratio: 4/3; max-width: 100%;
  border: 3px solid var(--grid); background: var(--paper); border-radius: 18px; cursor: pointer; color: var(--ink);
  display: grid; place-items: center;
}
.opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 18%, var(--paper)); animation: pop .4s; }
.opt.wrong { border-color: var(--bad); animation: shake .4s; opacity: .55; }
.progress { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.progress i { width: 14px; height: 14px; border-radius: 50%; background: var(--grid); }
.progress i.ok { background: var(--good); }
.progress i.miss { background: var(--bad); }
.progress i.now { background: var(--sun); }

/* memory */
.mem { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; max-width: 560px; margin: 0 auto; }
.mcard {
  --pic: 40px; aspect-ratio: 1; max-width: 100%; border-radius: 14px; cursor: pointer;
  border: 3px solid var(--ink); background: var(--sky); color: var(--ink);
  display: grid; place-items: center; padding: 4px; position: relative;
}
.mcard .back { font-family: var(--en); font-weight: 700; font-size: 28px; color: #fff; }
.mcard.open, .mcard.matched { background: var(--paper); }
.mcard.matched { border-color: var(--good); }
.mcard .w { font-family: var(--en); font-weight: 700; font-size: clamp(13px, 3.4vw, 19px); overflow-wrap: anywhere; text-align: center; }
.memo-bar { display: flex; justify-content: center; gap: 18px; font-family: var(--display); color: var(--ink-soft); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.memo-bar .over { color: var(--bad); }

/* result */
.result { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 8px 0; }
.result .bigstar { font-size: 96px; line-height: 1; color: var(--sun); text-shadow: 0 4px 0 var(--sun-ink); animation: spinpop .9s; }
.result .bigstar.dim { color: var(--grid); text-shadow: none; animation: none; }
.result .big { font-family: var(--display); font-size: 32px; text-wrap: balance; }
.result .confetti { font-size: 40px; letter-spacing: 6px; }

/* kids */
.kids { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.kid {
  border: 3px solid var(--grid); background: var(--paper); border-radius: 18px; padding: 14px 10px;
  display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--ink); min-width: 0;
}
.kid.active { border-color: var(--sun); }
.kid .av { font-size: 48px; line-height: 1; }
.kid .nm { font-family: var(--display); font-size: 20px; overflow-wrap: anywhere; text-align: center; }
.kid .lv { font-size: 14px; color: var(--ink-soft); }
.kid .btn { font-size: 17px; padding: 6px 16px; }
.newkid { display: flex; flex-direction: column; gap: 12px; background: var(--paper); border-radius: 18px; padding: 16px; }
.newkid label { font-family: var(--display); font-size: 17px; }
.newkid input[type="text"] {
  font-family: var(--display); font-size: 20px; padding: 10px 14px; border-radius: 12px; border: 3px solid var(--ink);
  background: var(--card); color: var(--ink); width: 100%; max-width: 320px;
}
.avatars { display: flex; gap: 8px; flex-wrap: wrap; }
.avatars label { cursor: pointer; }
.avatars input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.avatars span { display: grid; place-items: center; width: 54px; height: 54px; font-size: 34px; border-radius: 50%; border: 3px solid var(--grid); background: var(--card); }
.avatars input:checked + span { border-color: var(--sky); background: color-mix(in srgb, var(--sky) 20%, var(--card)); }
.avatars input:focus-visible + span { outline: 3px solid var(--sun); outline-offset: 2px; }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  font-family: var(--en); font-weight: 700; font-size: 26px; background: var(--ink); color: var(--paper);
  padding: 10px 26px; border-radius: 999px; pointer-events: none; opacity: 0; transition: opacity .2s; white-space: nowrap;
}
.toast.show { opacity: 1; }

@media (max-width: 480px) {
  .learn { grid-template-columns: repeat(2, 1fr); }
  .mem { grid-template-columns: repeat(3, 1fr); }
  .mem.m16 { grid-template-columns: repeat(4, 1fr); }
  .mem.m16 .mcard { --pic: 30px; }
  .options.six { grid-template-columns: repeat(2, 1fr); }
  .stage { padding: 14px; }
  .map { grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .tile .emo { font-size: 26px; }
  .tile .nm { font-size: 13px; }
  .stat b { font-size: 22px; }
}
@keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
@keyframes spinpop { 0% { transform: scale(.2) rotate(-90deg); } 70% { transform: scale(1.2) rotate(10deg); } 100% { transform: scale(1) rotate(0); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
@keyframes wiggle { 0%,100% { transform: rotate(0); } 30% { transform: rotate(-4deg); } 70% { transform: rotate(4deg); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>영어 놀이터 <span class="en">Play!</span></h1>
    <div class="head-right" id="head-right"></div>
  </header>
  <main class="stage" id="stage"></main>
  <p class="save-note" id="save-note">기록을 불러오는 중이에요…</p>
</div>
<div class="toast" id="toast"></div>

<script>
const SPEAKER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';

/* ---------- words, one set per level ---------- */
const LEVELS = [
  { name: "동물", items: [
    { en: "cat", say: "캣", ko: "고양이", e: "🐱" }, { en: "dog", say: "도그", ko: "강아지", e: "🐶" },
    { en: "rabbit", say: "래빗", ko: "토끼", e: "🐰" }, { en: "lion", say: "라이언", ko: "사자", e: "🦁" },
    { en: "elephant", say: "엘리펀트", ko: "코끼리", e: "🐘" }, { en: "monkey", say: "멍키", ko: "원숭이", e: "🐵" },
    { en: "fish", say: "피쉬", ko: "물고기", e: "🐟" }, { en: "bird", say: "버드", ko: "새", e: "🐦" } ]},
  { name: "과일", items: [
    { en: "apple", say: "애플", ko: "사과", e: "🍎" }, { en: "banana", say: "버내너", ko: "바나나", e: "🍌" },
    { en: "grape", say: "그레이프", ko: "포도", e: "🍇" }, { en: "strawberry", say: "스트로베리", ko: "딸기", e: "🍓" },
    { en: "orange", say: "오린지", ko: "오렌지", e: "🍊" }, { en: "watermelon", say: "워터멜런", ko: "수박", e: "🍉" },
    { en: "peach", say: "피치", ko: "복숭아", e: "🍑" }, { en: "lemon", say: "레먼", ko: "레몬", e: "🍋" } ]},
  { name: "색깔", items: [
    { en: "red", say: "레드", ko: "빨간색", c: "#e53935" }, { en: "blue", say: "블루", ko: "파란색", c: "#1e6fe0" },
    { en: "yellow", say: "옐로우", ko: "노란색", c: "#ffd600" }, { en: "green", say: "그린", ko: "초록색", c: "#2e9e4f" },
    { en: "pink", say: "핑크", ko: "분홍색", c: "#ff7eb6" }, { en: "purple", say: "퍼플", ko: "보라색", c: "#8e44c9" },
    { en: "black", say: "블랙", ko: "검은색", c: "#111111" }, { en: "white", say: "화이트", ko: "하얀색", c: "#ffffff" } ]},
  { name: "숫자", items: [
    { en: "one", say: "원", ko: "하나", n: 1 }, { en: "two", say: "투", ko: "둘", n: 2 },
    { en: "three", say: "쓰리", ko: "셋", n: 3 }, { en: "four", say: "포", ko: "넷", n: 4 },
    { en: "five", say: "파이브", ko: "다섯", n: 5 }, { en: "six", say: "식스", ko: "여섯", n: 6 },
    { en: "seven", say: "세븐", ko: "일곱", n: 7 }, { en: "eight", say: "에잇", ko: "여덟", n: 8 } ]},
  { name: "몸", items: [
    { en: "eye", say: "아이", ko: "눈", e: "👁️" }, { en: "nose", say: "노우즈", ko: "코", e: "👃" },
    { en: "mouth", say: "마우쓰", ko: "입", e: "👄" }, { en: "ear", say: "이어", ko: "귀", e: "👂" },
    { en: "hand", say: "핸드", ko: "손", e: "✋" }, { en: "foot", say: "풋", ko: "발", e: "🦶" },
    { en: "tooth", say: "투쓰", ko: "이", e: "🦷" }, { en: "arm", say: "암", ko: "팔", e: "💪" } ]},
  { name: "탈것", items: [
    { en: "car", say: "카", ko: "자동차", e: "🚗" }, { en: "bus", say: "버스", ko: "버스", e: "🚌" },
    { en: "train", say: "트레인", ko: "기차", e: "🚆" }, { en: "bike", say: "바이크", ko: "자전거", e: "🚲" },
    { en: "airplane", say: "에어플레인", ko: "비행기", e: "✈️" }, { en: "ship", say: "쉽", ko: "배", e: "🚢" },
    { en: "truck", say: "트럭", ko: "트럭", e: "🚚" }, { en: "taxi", say: "택시", ko: "택시", e: "🚕" } ]},
  { name: "음식", items: [
    { en: "bread", say: "브레드", ko: "빵", e: "🍞" }, { en: "milk", say: "밀크", ko: "우유", e: "🥛" },
    { en: "egg", say: "에그", ko: "달걀", e: "🥚" }, { en: "rice", say: "라이스", ko: "밥", e: "🍚" },
    { en: "cake", say: "케이크", ko: "케이크", e: "🍰" }, { en: "pizza", say: "피자", ko: "피자", e: "🍕" },
    { en: "cookie", say: "쿠키", ko: "과자", e: "🍪" }, { en: "juice", say: "주스", ko: "주스", e: "🧃" } ]},
  { name: "하늘과 자연", items: [
    { en: "sun", say: "썬", ko: "해", e: "☀️" }, { en: "moon", say: "문", ko: "달", e: "🌙" },
    { en: "star", say: "스타", ko: "별", e: "⭐" }, { en: "rain", say: "레인", ko: "비", e: "🌧️" },
    { en: "snow", say: "스노우", ko: "눈", e: "❄️" }, { en: "tree", say: "트리", ko: "나무", e: "🌳" },
    { en: "flower", say: "플라워", ko: "꽃", e: "🌸" }, { en: "cloud", say: "클라우드", ko: "구름", e: "☁️" } ]},
];
const ALL_WORDS = LEVELS.flatMap(l => l.items);
const STARS_PER_LEVEL = 5;
const AVATARS = ["🐯", "🐻", "🐼", "🦊", "🐨", "🐸"];
const CHEERS = ["Great!", "Good job!", "Super!", "Wow!", "Yes!"];

/* Level numbers start at 1. After the last word set, levels keep going as mixed review. */
function levelInfo(lv) {
  if (lv <= LEVELS.length) return { name: LEVELS[lv - 1].name, items: LEVELS[lv - 1].items, review: false };
  return { name: "챔피언 복습", items: null, review: true };
}
function levelWords(lv) {
  const info = levelInfo(lv);
  return info.items || shuffle(ALL_WORDS).slice(0, 8);
}
function learnedWords(lv) { return LEVELS.slice(0, Math.min(lv, LEVELS.length)).flatMap(l => l.items); }

/* Mission for the next star: which game, and what counts as success. Harder from level 5. */
function missionFor(kid) {
  const lv = kid.level, step = kid.stars, hard = lv >= 5;
  const opts = hard ? 6 : 4, pairs = hard ? 8 : 6, maxTries = pairs * 2 + 2;
  return [
    { type: "learn", label: "배우기", text: "그림 8개를 모두 눌러서 따라 말하기" },
    { type: "quiz", label: "듣고 찾기", n: 8, pass: 6, opts, text: `잘 듣고 8문제 중 6개 맞히기` },
    { type: "memory", label: "짝 맞추기", pairs, maxTries, text: `짝 ${pairs}쌍을 ${maxTries}번 안에 모두 찾기` },
    { type: "quiz", label: "듣고 찾기", n: 8, pass: 7, opts, text: `잘 듣고 8문제 중 7개 맞히기` },
    { type: "quiz", label: "보스 미션", boss: true, n: 10, pass: 8, opts, text: lv === 1 ? "보스 미션! 10문제 중 8개 맞히기" : "보스 미션! 지금까지 배운 단어로 10문제 중 8개 맞히기" },
  ][step];
}

/* ---------- saving: account store when available, this device otherwise ---------- */
const LOCAL_KEY = "english-playground-v1";
let save = { kids: {}, active: null, updatedAt: 0 };
const persist = { ref: null, mode: "loading", writing: false, dirty: false };

function clone(o) { return JSON.parse(JSON.stringify(o)); }
function readLocal() { try { const s = localStorage.getItem(LOCAL_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function writeLocal() { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(save)); } catch (e) {} }
function valid(d) { return d && typeof d === "object" && d.kids && typeof d.kids === "object"; }

async function flush() {
  if (!persist.ref) return;
  if (persist.writing) { persist.dirty = true; return; }
  persist.writing = true;
  do {
    persist.dirty = false;
    try { await persist.ref.set(clone(save)); }
    catch (e) {
      if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 800 + Math.random() * 800)); persist.dirty = true; }
      else { persist.ref = null; persist.mode = "local"; renderSaveNote(); break; }
    }
  } while (persist.dirty && persist.ref);
  persist.writing = false;
}
function commit() {
  save.updatedAt = Date.now();
  writeLocal();
  flush();
}
function renderSaveNote() {
  const el = document.getElementById("save-note");
  el.textContent = persist.mode === "account" ? "기록은 내 계정에 저장돼요. 다른 기기에서 열어도 이어서 할 수 있어요."
    : persist.mode === "local" ? "기록은 이 기기의 브라우저에 저장돼요."
    : "기록을 불러오는 중이에요…";
}

async function connectStore() {
  try {
    if (!window.claude || !window.claude.use) throw 0;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) throw 0;
    const uid = await user.id();
    if (!uid) throw 0;
    const ref = db.doc("data/users/" + uid + "/save");
    const snap = await ref.get();
    persist.ref = ref; persist.mode = "account";
    const remote = snap.exists ? snap.data() : null;
    if (valid(remote) && (remote.updatedAt || 0) >= (save.updatedAt || 0)) {
      save = clone(remote); writeLocal();
      if (screen.name === "home" || screen.name === "kids") route(screen.name);
      else renderHead();
    } else if (Object.keys(save.kids).length) {
      flush();
    }
  } catch (e) {
    persist.mode = "local";
  }
  renderSaveNote();
}

/* ---------- helpers ---------- */
const $ = (id) => document.getElementById(id);
const stage = $("stage");
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]); }
function kid() { return save.kids[save.active] || null; }
function totalStars(k) { return (k.level - 1) * STARS_PER_LEVEL + k.stars; }

let voice = null;
function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices();
    voice = vs.find(v => v.lang === "en-US") || vs.find(v => v.lang && v.lang.startsWith("en")) || null;
  } catch (e) {}
}
try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {}
function speak(text, rate = 0.8) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = rate; u.pitch = 1.1;
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  } catch (e) {}
}

function pic(item) {
  if (item.e) return `<div class="pic"><span class="emo" aria-hidden="true">${item.e}</span></div>`;
  if (item.c) return `<div class="pic"><span class="swatch" style="background:${item.c}"></span></div>`;
  const dots = Array.from({ length: item.n }, () => "<i></i>").join("");
  return `<div class="pic"><span class="num">${item.n}</span><span class="dots">${dots}</span></div>`;
}

let toastTimer;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 900);
}
function markHeard(k, item) { k.heard = k.heard || {}; k.heard[item.en] = 1; }
function timeLabel(t) {
  const d = new Date(t);
  return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}

/* setTimeout that is dropped once the child has left the screen it was set on */
function later(fn, ms) { const gen = screen.gen; setTimeout(() => { if (screen.gen === gen) fn(); }, ms); }
function route(name, arg) {

    ${hist.length ? `<ul class="log">${hist.map(h => `
      <li><span class="mk ${h.ok ? "ok" : "no"}">${h.ok ? "★" : "○"}</span>

/* ---------- practice: free word cards, no star ---------- */
function renderPractice(lv) {
  const k = kid(), items = LEVELS[lv - 1].items;
  stage.innerHTML = `
    <div class="playbar"><button class="link-btn" id="back">← 홈으로</button><span class="goal">연습 · Lv${lv} ${LEVELS[lv - 1].name}</span></div>
    <p class="hint">그림을 눌러서 따라 말해 보세요!</p>
    ${learnGrid(items, k)}`;
  bindLearn(items, k, () => {});
  $("back").addEventListener("click", () => { commit(); route("home"); });
}
function learnGrid(items, k) {
  return `<div class="learn">${items.map((it, i) => `
    <button class="lcard" data-i="${i}" aria-label="${it.ko}, ${it.en}">
      ${pic(it)}<span class="word">${it.en}</span><span class="say">[${it.say}]</span><span class="ko">${it.ko}</span>
    </button>`).join("")}</div>`;
}
function bindLearn(items, k, onTap) {
  stage.querySelectorAll(".lcard").forEach(c => c.addEventListener("click", () => {
    const it = items[c.dataset.i];
    speak(it.en); markHeard(k, it);
    c.classList.add("heard");
    c.classList.remove("speaking"); void c.offsetWidth; c.classList.add("speaking");
    onTap(+c.dataset.i);
  }));
}

/* ---------- missions ---------- */
function playbar(m) {
  return `<div class="playbar"><button class="link-btn" id="quit">← 그만하기</button><span class="goal" id="goal">${m.boss ? "보스 " : ""}미션: ${m.text}</span></div>`;
}
function bindQuit() { $("quit").addEventListener("click", () => { commit(); route("home"); }); }

function startMission() {
  const k = kid(), m = missionFor(k);
  if (m.type === "learn") return missionLearn(k, m);
  if (m.type === "quiz") return missionQuiz(k, m);
  return missionMemory(k, m);
}

function missionLearn(k, m) {
  const items = levelWords(k.level), heard = new Set(); let done = false;
  stage.innerHTML = `${playbar(m)}
    <p class="hint" id="count">들은 그림 0 / ${items.length}</p>
    ${learnGrid(items, k)}`;
  bindQuit();
  bindLearn(items, k, (i) => {
    heard.add(i);
    $("count").textContent = `들은 그림 ${heard.size} / ${items.length}`;
    if (heard.size === items.length && !done) { done = true; later(() => finish(k, m, true, `단어 ${items.length}개를 모두 들었어요`), 1100); }
  });
}

function missionQuiz(k, m) {
  const pool = m.boss ? learnedWords(k.level) : levelWords(k.level);
  const order = [];
  while (order.length < m.n) order.push(...shuffle(pool));
  const q = { order: order.slice(0, m.n), round: 0, marks: [], score: 0 };
  const round = (first) => {
    if (q.round >= q.order.length) {
      const ok = q.score >= m.pass;
      return finish(k, m, ok, `${m.n}문제 중 ${q.score}개 맞힘`);
    }
    const answer = q.order[q.round];
    const optPool = pool.length >= m.opts ? pool : ALL_WORDS;
    const opts = shuffle([answer, ...shuffle(optPool.filter(x => x.en !== answer.en)).slice(0, m.opts - 1)]);
    let firstTry = true, locked = false;
    stage.innerHTML = `${playbar(m)}
      <div class="quiz-top">
        <button class="speak-big" id="speak-big" aria-label="다시 듣기">${SPEAKER}</button>
        <p class="hint">잘 듣고 맞는 그림을 눌러요 · 맞힌 개수 ${q.score} / 목표 ${m.pass}</p>
        <div class="qword" id="qword"></div>
      </div>
      <div class="options ${m.opts > 4 ? "six" : ""}">${opts.map((o, i) => `<button class="opt" data-i="${i}" aria-label="${o.ko}">${pic(o)}</button>`).join("")}</div>
      <div class="progress">${q.order.map((_, i) => `<i class="${i < q.round ? (q.marks[i] ? "ok" : "miss") : i === q.round ? "now" : ""}"></i>`).join("")}</div>`;
    bindQuit();
    const big = $("speak-big");
    const play = () => { speak(answer.en); big.classList.remove("ping"); void big.offsetWidth; big.classList.add("ping"); };
    big.addEventListener("click", play);
    setTimeout(play, first ? 50 : 250);
    stage.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if (locked) return;
      const o = opts[b.dataset.i];
      if (o.en === answer.en) {
        locked = true; b.classList.add("right"); markHeard(k, answer);
        $("qword").textContent = `${answer.en}  [${answer.say}]`;
        if (firstTry) q.score++;
        q.marks[q.round] = firstTry;
        const cheer = firstTry ? CHEERS[Math.floor(Math.random() * CHEERS.length)] : "OK!";
        toast(cheer); speak(cheer, 0.95);
        later(() => { q.round++; round(false); }, 1400);
      } else {
        firstTry = false; b.classList.add("wrong");
        setTimeout(() => speak(answer.en), 350);
      }
    }));
  };
  round(true);
}

function missionMemory(k, m) {
  const pairs = shuffle(levelWords(k.level)).slice(0, m.pairs);
  const cards = shuffle(pairs.flatMap((it, p) => [{ p, it, kind: "pic" }, { p, it, kind: "word" }]));
  const st = { open: [], matched: 0, tries: 0, lock: false };
  stage.innerHTML = `${playbar(m)}
    <p class="hint">그림과 영어 단어 짝을 찾아요</p>
    <div class="mem ${cards.length > 12 ? "m16" : ""}">${cards.map((c, i) => `<button class="mcard" data-i="${i}" aria-label="카드 ${i + 1}"><span class="back">?</span></button>`).join("")}</div>
    <div class="memo-bar"><span id="mem-pairs">찾은 짝 0 / ${m.pairs}</span><span id="mem-tries">시도 0 / ${m.maxTries}번</span></div>`;
  bindQuit();
  const face = (c) => c.kind === "pic" ? pic(c.it) : `<span class="w">${c.it.en}</span>`;
  stage.querySelectorAll(".mcard").forEach(b => b.addEventListener("click", () => {
    const c = cards[b.dataset.i];
    if (st.lock || b.classList.contains("open") || b.classList.contains("matched")) return;
    b.classList.add("open"); b.innerHTML = face(c);
    if (c.kind === "word") speak(c.it.en);
    st.open.push(b);
    if (st.open.length < 2) return;
    st.tries++;
    const triesEl = $("mem-tries");
    triesEl.textContent = `시도 ${st.tries} / ${m.maxTries}번`;
    triesEl.classList.toggle("over", st.tries > m.maxTries);
    const [a, d] = st.open; st.open = [];
    const ca = cards[a.dataset.i], cd = cards[d.dataset.i];
    if (ca.p === cd.p && ca.kind !== cd.kind) {
      a.classList.replace("open", "matched"); d.classList.replace("open", "matched");
      st.matched++; markHeard(k, ca.it);
      $("mem-pairs").textContent = `찾은 짝 ${st.matched} / ${m.pairs}`;
      setTimeout(() => speak(ca.it.en), 300); toast(ca.it.en + "!");
      if (st.matched === m.pairs) later(() => finish(k, m, st.tries <= m.maxTries, `${st.tries}번 만에 모두 찾음`), 1200);
    } else {
      st.lock = true;
      later(() => { [a, d].forEach(x => { x.classList.remove("open"); x.innerHTML = '<span class="back">?</span>'; }); st.lock = false; }, 1000);
    }
  }));
}

/* ---------- result: star, level up, save ---------- */
function finish(k, m, ok, detail) {
  const levelBefore = k.level;
  let levelUp = false;
  if (ok) {
    k.stars++;
    if (k.stars >= STARS_PER_LEVEL) { k.stars = 0; k.level++; levelUp = true; }
  }
  k.history = (k.history || []).concat({ t: Date.now(), level: levelBefore, label: m.label, detail, ok }).slice(-30);
  commit();
  renderHead();

  if (levelUp) {
    const next = levelInfo(k.level);
    stage.innerHTML = `<div class="result">
      <div class="confetti" aria-hidden="true">🎉 ⭐ 🎉</div>
      <div class="bigstar">★</div>
      <div class="big">Level up! 레벨 ${k.level}이 되었어요!</div>
      <p class="hint">별 ${STARS_PER_LEVEL}개를 다 모았어요. 다음은 <b>${next.name}</b> 단어예요.</p>
      <div class="btn-row"><button class="btn" id="next">새 레벨 시작!</button><button class="btn plain" id="home">홈으로</button></div>
    </div>`;
    speak("Level up! Amazing!", 0.95);
  } else if (ok) {
    screen.justEarned = true;
    stage.innerHTML = `<div class="result">
      <div class="bigstar">★</div>
      <div class="big">미션 성공! 별 1개를 받았어요</div>
      <p class="hint">${esc(detail)} · 레벨 업까지 별 ${STARS_PER_LEVEL - k.stars}개 남았어요</p>
      <div class="btn-row"><button class="btn" id="next">다음 미션</button><button class="btn plain" id="home">홈으로</button></div>
    </div>`;
    speak("Great job! You got a star!", 0.95);
  } else {
    stage.innerHTML = `<div class="result">
      <div class="bigstar dim">★</div>
      <div class="big">아깝다! 다시 해 볼까요?</div>
      <p class="hint">${esc(detail)} · 목표: ${esc(m.text)}</p>
      <div class="btn-row"><button class="btn" id="next">다시 도전!</button><button class="btn plain" id="home">홈으로</button></div>
    </div>`;
    speak("Nice try! Let's try again!", 0.95);
  }
  $("next").addEventListener("click", () => route("mission"));
  $("home").addEventListener("click", () => route("home"));
}

/* ---------- boot ---------- */
const local = readLocal();
if (valid(local)) save = local;
route(kid() ? "home" : "kids");
connectStore();
</script>
</body>
</html>
